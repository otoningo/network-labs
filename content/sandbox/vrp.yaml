# Router de práctica de la referencia de comandos de VRP: sin tareas que cumplir.
# Los ejemplos de content/reference/vrp se prueban sobre esta topología.
# El esquema de lab exige un objetivo; la referencia no lo muestra.
# Sin radios: el driver de VRP no tiene Wi-Fi.
id: sandbox-vrp
vendor: vrp
title:
  es: Router de práctica
  en: Practice router
summary:
  es: Un router Huawei de fábrica con un proveedor y dos PC, para probar comandos.
  en: A factory Huawei router with a provider and two PCs, to try commands on.
difficulty: beginner
minutes: 5

topology:
  devices:
    - id: ISP
      os: internet
      board: sim-cloud
      label: { es: Proveedor, en: Provider }
      position: { x: 100, y: 200 }
      internet:
        address: 203.0.113.1/24
        dns:
          example.com: 93.184.216.34
    - id: R1
      os: vrp
      board: sim-r5
      label: { es: Router de práctica, en: Practice router }
      position: { x: 380, y: 200 }
    - id: PC1
      os: host
      board: sim-host
      label: { es: PC fija, en: Static PC }
      position: { x: 660, y: 100 }
      host:
        ip: 192.168.88.10/24
        gateway: 192.168.88.1
        dns: [192.168.88.1]
    - id: PC2
      os: host
      board: sim-host
      label: { es: PC por DHCP, en: DHCP PC }
      position: { x: 660, y: 300 }
      host:
        ip: dhcp
  links:
    - [ISP:eth0, R1:GigabitEthernet0/0/0]
    - [R1:GigabitEthernet0/0/1, PC1:eth0]
    - [R1:GigabitEthernet0/0/2, PC2:eth0]

objectives:
  - id: explorar
    text:
      es: Explora el router con `?` y Tab.
      en: Explore the router with `?` and Tab.
    check:
      interfaceRunning: { device: R1, iface: GigabitEthernet0/0/0 }
    hints:
      - es: No hay nada que cumplir aquí.
        en: There is nothing to complete here.

explanation:
  es: Router de práctica.
  en: Practice router.
